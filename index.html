<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Master</title><style>*{box-sizing:border-box}body{margin:0;background:#090d1d;color:#f7f8ff;font-family:system-ui,sans-serif}.app{max-width:600px;margin:auto;padding:20px}.card{background:#151b35;border:1px solid #303a62;border-radius:22px;padding:20px}.screen{display:none}.active{display:block}h1{font-size:30px;text-align:center}.muted{color:#aab4d3}.row{display:flex;gap:10px}.row>*{flex:1}input,button{width:100%;min-height:52px;border-radius:14px;border:1px solid #39456b;padding:12px;font-size:16px}input{background:#0e1430;color:white}button{background:#62e6bd;color:#071311;font-weight:800;cursor:pointer}.secondary{background:#1d2647;color:white}.choice{margin:7px 0;text-align:left;background:#1d2647;color:white}.choice.correct{background:#123a36;border-color:#62e6bd}.choice.wrong{background:#40212c;border-color:#ff8792}.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}.pill{background:#0e1430;border-radius:12px;padding:10px;text-align:center;flex:1}.prompt{padding:16px;background:#0c1227;border-radius:16px;line-height:1.6;margin:14px 0}.error{color:#ff9aa5;min-height:24px}.center{text-align:center}.code{font-size:40px;letter-spacing:7px;font-weight:900;text-align:center;color:#62e6bd}.players{display:grid;gap:8px}.player{background:#0e1430;padding:12px;border-radius:12px;display:flex;justify-content:space-between}</style></head><body><div class="app"><h1>🎯 Prompt Master</h1><div id="home" class="screen active card"><p class="muted center">2-player real-time prompt anatomy quiz</p><input id="name" placeholder="Your name" maxlength="20"><button id="create">Create Room</button><div style="height:10px"></div><input id="room" placeholder="6-character room code" maxlength="6"><button id="join" class="secondary">Join Room</button><div id="err" class="error"></div></div><div id="lobby" class="screen card"><div class="muted center">Room code</div><div id="code" class="code"></div><p class="center muted">Share this code with the other player.</p><div id="players" class="players"></div></div><div id="game" class="screen card"><div class="top"><div class="pill" id="round">Round 1/5 · Q1/5</div><div class="pill" id="timer">⏱ 15s</div><div class="pill" id="score">0 pts</div><div class="pill" id="streak">🔥 0</div></div><div class="muted" id="badge"></div><h2 id="title"></h2><div class="prompt" id="prompt"></div><div id="choices"></div><p id="feedback" class="center"></p></div><div id="finish" class="screen card center"><h2>🏆 Game Complete</h2><div id="final"></div><button onclick="location.reload()">Play Again</button></div></div><script>let ws,me,roomCode,state,timerInterval;const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host);ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>{$('err').textContent='Connection lost. Refresh to reconnect.'}}function handle(m){if(m.type==='error'){$('err').textContent=m.message;return}if(m.type==='created'){me=m.playerId;roomCode=m.code;$('code').textContent=roomCode;show('lobby');return}if(m.type==='opponentLeft'){$('err').textContent='The other player left. Waiting for a new player.';show('lobby');return}if(m.type==='answerResult'){ $('feedback').textContent=m.timeout?'⏰ Time up!':(m.correct?'✅ Correct! +'+m.points:'❌ Incorrect');return}if(m.type==='finished'){$('final').innerHTML=m.players.map(p=>'<p><b>'+p.name+'</b>: '+p.score+' points</p>').join('');show('finish');return}if(m.type==='state'){state=m; if(m.status==='waiting'){show('lobby');$('players').innerHTML=m.players.map(p=>'<div class="player"><span>'+p.name+'</span><span>Ready</span></div>').join('');if(m.players.length<2)$('players').innerHTML+='<div class="muted center">Waiting for Player 2…</div>'}else{show('game');render()}}}function render(){
 if(!state.question){$('round').textContent='Finished';$('timer').textContent='⏱ —';$('title').textContent='You finished!';$('prompt').textContent='Waiting for the other player to finish…';$('badge').textContent='';$('choices').innerHTML='';$('feedback').textContent='';if(timerInterval)clearInterval(timerInterval);return}
 const mep=state.players.find(p=>p.id===me);
 const roundNo=Math.floor(state.round/5)+1, questionNo=(state.round%5)+1;
 $('round').textContent='Round '+roundNo+'/5 · Q'+questionNo+'/5';
 $('score').textContent=(mep?mep.score:0)+' pts';
 $('streak').textContent='🔥 '+(mep?mep.streak:0);
 $('badge').textContent=state.question.badge;
 $('title').textContent=state.question.title;
 $('prompt').textContent=state.question.prompt;
 $('feedback').textContent='';
 $('choices').innerHTML='';
 state.question.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{[...$('choices').children].forEach(x=>x.disabled=true);ws.send(JSON.stringify({type:'answer',answer:i}))};$('choices').appendChild(b)});
 if(timerInterval)clearInterval(timerInterval);
 function tick(){const left=Math.max(0,Math.ceil(((state.deadline||Date.now()+15000)-Date.now())/1000));$('timer').textContent='⏱ '+left+'s';}
 tick();timerInterval=setInterval(tick,250);
}
connect();$('create').onclick=()=>{const name=$('name').value.trim()||'Player 1';ws.send(JSON.stringify({type:'create',name}))};$('join').onclick=()=>{const name=$('name').value.trim()||'Player 2';ws.send(JSON.stringify({type:'join',name,code:$('room').value.trim().toUpperCase()}))};</script></body></html>
